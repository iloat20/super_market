name: super_market
description: "A 股实时行情（个人自用，新浪/腾讯公开源轮询，仅前台盯盘）"
publish_to: 'none'
version: 1.0.7+35

environment:
  # 收紧到实际用到的最低 Dart。原来写 `>=3.4.0`（对应 Flutter 3.22），
  # 但代码里已经在用 `Color.withValues()` / `toARGB32()`——这两个是
  # Flutter 3.27 / Dart 3.6 才有的 API。旧约束会让 `pub get` 通过、
  # 编译期才炸，属于约束在骗自己。
  sdk: '^3.13.0'

dependencies:
  liquid_glass_widgets: ^1.16.1
  flutter:
    sdk: flutter
  # 应用私有目录：用来缓存订阅列表（<1KB）和股票目录（约 195KB）
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 4.0.0 → 6.0.0：跨了两个大版本，新规则（如 use_build_context_synchronously
  # 的加强、unnecessary_async 等）可能报一批，已逐条修到 analyze 干净
  flutter_lints: ^6.0.0
  # 仅测试用：testWidgets 的 FakeAsync 会接管 clock.now()，
  # 用来验证「半开连接超时」这类依赖时间差的逻辑
  clock: ^1.1.3

flutter:
  uses-material-design: true
  # 苹果观感的开源替代（SF Pro 授权不允许打包进安卓；Inter 为 OFL 可自由分发）
  # latin 子集只覆盖数字/拉丁/常用标点，中文逐字符回退系统字体
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter-latin-400.ttf
          weight: 400
        - asset: assets/fonts/inter-latin-500.ttf
          weight: 500
        - asset: assets/fonts/inter-latin-600.ttf
          weight: 600
        - asset: assets/fonts/inter-latin-700.ttf
          weight: 700

