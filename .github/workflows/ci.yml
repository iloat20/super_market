# 门禁自动化（review-2026-11-05 路线图「长期」项）：
# 与本地门禁完全同源——analyze 0 issues + flutter test 全绿。
#
# 为什么只跑这两步、不跑打包：verify_apk 需要签名密钥与完整 Android SDK，
# 且打包产物只在装机前有意义；CI 的价值是把「代码级门禁」挡在 push/PR 上。
#
# 为什么必须是 windows-latest（首轮 CI 实测教训，linux runner 会红）：
# golden harness 要加载**真中文字体**（中文没法用 Ahem 画），搜索顺序是
# C:/Windows/Fonts/simhei.ttf → msyh.ttc → …。goldens 是在 Windows + SimHei
# 下生成的，Linux 上装 wqy-zenhei 虽能让 setUpAll 过，但字形完全不同，
# 像素比对必红。Windows runner 自带 SimHei / 雅黑，与生成环境逐字节一致。
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      # 版本钉死与本机一致（flutter --version：3.47.9 stable），
      # 升级 Flutter 必须显式改这里——跟着 latest 漂会让 CI 与本地门禁说两套话
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      # golden（test/preview，@Tags preview）排除在 CI 外：像素基线与生成
      # 机器绑定（runner 的 SimHei 版本与本机有 1.05% 级微差，字节比对必红，
      # 见 app_preview_test.dart 头注）。本地 flutter test 仍然全量跑。
      - run: flutter test --exclude-tags preview
